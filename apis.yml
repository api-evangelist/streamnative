aid: streamnative
name: StreamNative
description: StreamNative is the company founded by the original creators of Apache Pulsar, offering StreamNative Cloud - a managed data streaming platform that runs Apache Pulsar and Apache Kafka-compatible
  (Kafka protocol) clusters as Serverless, Dedicated, BYOC and self-managed Private Cloud deployments, with Lakehouse storage integration, connectors and Pulsar Functions. It publishes a Kubernetes-style
  Cloud API at api.streamnative.cloud for managing API keys, service accounts, Pulsar instances, clusters and gateways, a Kafka REST API, and an MCP server.
